<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答案之书 · 大学生专供版</title>
<meta name="description" content="一本会翻页、会出声的答案之书。专供大学生：外卖、食堂、DDL、睡觉，任何问题都可以问它。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/book.css">
<link rel="stylesheet" href="css/anim.css">
</head>
<body>

<div class="desk-glow" aria-hidden="true"></div>

<div class="app">

  <header class="topbar">
    <h1 class="brand">答案之书</h1>
    <button id="btnSound" class="sound-btn" type="button" aria-pressed="true" title="开关音效">
      <span class="sound-dot" aria-hidden="true"></span>
      <span class="sound-label" id="soundLabel">音效开</span>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="book" id="book" data-state="closed">

      <div class="spread" id="spread">

        <div class="half half-left" id="halfLeft" title="点击合上书本">
          <div class="page page-left">
            <div class="page-face" id="pageLeft"></div>
            <div class="page-shade page-shade-right" aria-hidden="true"></div>
          </div>
          <div class="folio folio-left" id="folioLeft"></div>
        </div>

        <div class="half half-right">
          <div class="page page-right">
            <div class="page-face" id="pageRight"></div>
            <div class="page-shade page-shade-left" aria-hidden="true"></div>
          </div>
          <div class="folio folio-right" id="folioRight"></div>
          <div class="leaf-layer" id="leafLayer" aria-hidden="true"></div>
        </div>

      </div>

      <div class="cover" id="cover" role="button" tabindex="0" aria-label="翻开答案之书">
        <div class="cover-face cover-front">
          <div class="cover-frame" aria-hidden="true"></div>
          <div class="cover-text">
            <div class="cover-title">答案之书</div>
            <div class="cover-rule" aria-hidden="true"></div>
            <div class="cover-sub">THE BOOK OF ANSWERS</div>
            <div class="cover-edition">大学生专供版</div>
          </div>
          <div class="cover-hint" id="coverHint">轻触翻开</div>
          <div class="cover-shine" aria-hidden="true"></div>
        </div>
        <div class="cover-face cover-back">
          <div class="cover-back-inner" aria-hidden="true"></div>
        </div>
      </div>

    </div>
  </main>

  <footer class="controls">
    <button id="btnDraw" class="btn btn-primary" type="button">抽取答案</button>
    <button id="btnRedraw" class="btn btn-ghost is-hidden" type="button">再抽一次</button>
    <button id="btnCopy" class="btn btn-ghost is-hidden" type="button">复制结果</button>
  </footer>

  <p class="foot-hint" id="footHint">轻触封面翻开 · 轻触左侧书页合上</p>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/fit.js"></script>
<script src="js/answers.js"></script>
<script src="js/data.js"></script>
<script src="js/sfx.js"></script>
<script src="js/book.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
